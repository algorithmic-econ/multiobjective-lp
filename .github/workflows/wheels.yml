name: Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/t07-*'  # TEMP: full-matrix dry run for T07; remove before merge
    tags:
      - 'bindings@[0-9].[0-9]+.[0-9]+'

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_tag:
    name: Validate tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/bindings@')
    steps:
    - uses: actions/checkout@v4

    - name: Check tag format and version consistency
      run: |
        TAG_NAME=${{ github.ref_name }}
        if [[ ! "$TAG_NAME" =~ ^bindings@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid tag format. Tag must follow 'bindings@X.Y.Z' format."
          exit 1
        fi
        TAG_VERSION=${TAG_NAME#bindings@}
        PYPROJECT_VERSION=$(grep -E '^version = ' bindings/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
        if [[ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]]; then
          echo "Tag version ($TAG_VERSION) does not match bindings/pyproject.toml version ($PYPROJECT_VERSION)."
          exit 1
        fi
        echo "Valid tag: $TAG_NAME (matches pyproject $PYPROJECT_VERSION)"

  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build SDist
      run: pipx run build --sdist bindings

    - name: Check metadata
      run: pipx run twine check bindings/dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: bindings/dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v4

    - uses: pypa/cibuildwheel@v3.4.1
      with:
        package-dir: bindings
      env:
        CIBW_BUILD: cp313-* cp314-*
        CIBW_ARCHS_WINDOWS: auto ARM64
        CIBW_CONFIG_SETTINGS_WINDOWS: cmake.args=-DPYBIND11_FINDPYTHON=ON
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=14.0
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
          auditwheel repair -w {dest_dir} {wheel}

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl


  upload_all:
    name: Upload if bindings tag
    needs: [validate_tag, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/bindings@')
    environment: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        merge-multiple: true
        path: dist

    - name: List files in dist directory
      run: ls -al dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false
