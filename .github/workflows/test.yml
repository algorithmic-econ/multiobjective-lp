name: test
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/roadmap-base-branch
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [core, solvers, experiments]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: ${{ matrix.project }}/.venv
        key: venv-${{ runner.os }}-py3.13-${{ matrix.project }}-${{ hashFiles('core/poetry.lock', 'solvers/poetry.lock', 'experiments/poetry.lock') }}

    - name: Install dependencies
      working-directory: ${{ matrix.project }}
      run: poetry install --no-interaction

    - name: Run tests
      working-directory: ${{ matrix.project }}
      run: poetry run pytest

  pyright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [core, solvers, experiments]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: ${{ matrix.project }}/.venv
        key: venv-${{ runner.os }}-py3.13-${{ matrix.project }}-${{ hashFiles('core/poetry.lock', 'solvers/poetry.lock', 'experiments/poetry.lock') }}

    - name: Install dependencies
      working-directory: ${{ matrix.project }}
      run: poetry install --no-interaction

    - name: Run pyright
      working-directory: ${{ matrix.project }}
      run: poetry run pyright
