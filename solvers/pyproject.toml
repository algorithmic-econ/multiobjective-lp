[project]
version = "0.0.14"
name = "muoblpsolvers"
description = "Solvers for multi objective linear programming"

authors = [
    { name = "Piotr Skowron", email = "p.skowron@mimuw.edu.pl" },
    { name = "Jan Sznajd", email = "j.sznajd@uw.edu.pl" }
]
license = "MIT"
readme = "README.md"

requires-python = ">=3.13"

dependencies = [
    "muoblp>=1.0.4,<2.0",
    "pulp==3.3.2",
    "muoblpbindings>=0.0.17,<0.1",
]

[project.urls]
repository = "https://github.com/jasieksz/multiobjective-lp"
documentation = "https://jasieksz.github.io/multiobjective-lp"

[tool.poetry]
packages = [{include = "muoblpsolvers", from = "src"}]

# Enrich published deps (versions in [project.dependencies]) with local
# path sources for dev; wheel METADATA keeps version pins, not file:// refs.
[tool.poetry.dependencies]
muoblp = {path = "../core", develop = true}
muoblpbindings = {path = "../bindings", develop = false}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest (>=8.4,<9.0)",
    "ruff (>=0.15.1,<0.16.0)",
    "pyright (>=1.1,<2.0)"
]
